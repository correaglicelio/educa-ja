<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Educa Já</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dados abertos da educação do seu município: escolas, infraestrutura, matrículas e professores, com dados oficiais do INEP.">
<meta name="theme-color" content="#23338C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Educa Já">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>

</style>
<style>
/* Layout: o mesmo do Saúde Já. Computador: menu lateral à esquerda, barra de local no topo, conteúdo rolando.
   Celular: faixa anil com a marca, barra de local, conteúdo e barra de navegação inferior. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --sunk:#E9ECF5; --ink:#141A33; --muted:#565E80; --line:#DCE1EE; --sel:#ECEFF9;
  --accent:#23338C; --accent-ink:#FFFFFF; --accent-soft:#E6E9F7; --lapis:#F2B705; --lapis-ink:#7A5A00; --lapis-soft:#FDF3D2;
  --tile1:#3346B0; --tile2:#1C2A78; --faixa:#23338C;
  --ok:#11845B; --ok-soft:#DEF3EA; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#C2283B; --bad-soft:#FBE1E4; --none:#6B7290; --none-soft:#E8EAF2;
  --r-mun:#2A78D6; --r-est:#EB6834; --r-fed:#1BAF7A; --r-pri:#C98A00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --shadow:0 1px 2px rgb(20 26 51 / .06), 0 8px 24px rgb(35 51 140 / .10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1324; --surface:#171C33; --sunk:#12172B; --ink:#E9ECF7; --muted:#A3ABC9; --line:#2A3152; --sel:#1F2648;
  --accent:#9DAAF2; --accent-ink:#0F1324; --accent-soft:#1F2850; --lapis:#F5C842; --lapis-ink:#F5D57A; --lapis-soft:#3A3014;
  --tile1:#3346B0; --tile2:#1A2462; --faixa:#1A2462;
  --ok:#4FD19D; --ok-soft:#123A2C; --warn:#F2A35A; --warn-soft:#3D2A14; --bad:#F27A8A; --bad-soft:#40161E; --none:#9AA2C0; --none-soft:#22283F;
  --r-mun:#6BA6F0; --r-est:#F48F63; --r-fed:#4CCB97; --r-pri:#E9BC4C;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1324; --surface:#171C33; --sunk:#12172B; --ink:#E9ECF7; --muted:#A3ABC9; --line:#2A3152; --sel:#1F2648;
  --accent:#9DAAF2; --accent-ink:#0F1324; --accent-soft:#1F2850; --lapis:#F5C842; --lapis-ink:#F5D57A; --lapis-soft:#3A3014;
  --tile1:#3346B0; --tile2:#1A2462; --faixa:#1A2462;
  --ok:#4FD19D; --ok-soft:#123A2C; --warn:#F2A35A; --warn-soft:#3D2A14; --bad:#F27A8A; --bad-soft:#40161E; --none:#9AA2C0; --none-soft:#22283F;
  --r-mun:#6BA6F0; --r-est:#F48F63; --r-fed:#4CCB97; --r-pri:#E9BC4C;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:1000; background:var(--surface)}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lapis); outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.app{height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); grid-template-columns:minmax(0,1fr)}
.app > *{min-width:0}
symbol .da{fill:var(--c1, var(--accent))} symbol .db{fill:var(--c2, color-mix(in srgb, var(--c1, var(--accent)) 35%, var(--surface)))} symbol .dw{fill:var(--surface)}
.dico{width:22px; height:22px; flex:none}

/* ---------- topo e menu ---------- */
.top{background:var(--surface); border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:10px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; margin-right:auto; text-decoration:none; color:inherit}
.brand .logo{width:44px; height:44px; flex:none}
.brand b{font-family:var(--f-display); font-weight:800; font-size:28px; letter-spacing:-.03em; line-height:1; color:var(--accent); white-space:nowrap}
.brand b em{font-style:normal; color:var(--lapis-ink)}
.brand small{display:block; color:var(--muted); font-size:12px; margin-top:3px; font-weight:500}
.views{display:flex; gap:2px}
.views button{border:0; background:transparent; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; text-align:left; font-weight:500; font-size:15px; color:var(--ink); --c1:var(--accent)}
.views button:hover{background:var(--sel)}
.views button[aria-pressed="true"]{background:var(--sel); color:var(--accent); font-weight:700; box-shadow:inset 3px 0 0 var(--lapis)}
.views .breve{display:flex; align-items:center; gap:12px; padding:8px 12px; font-size:14px; color:var(--muted); --c1:var(--none); --c2:var(--none-soft)}
.views .breve small{margin-left:auto; font-size:11px; font-weight:700; background:var(--sunk); border-radius:999px; padding:1px 7px}
.menu-tit{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:14px 12px 4px}
.top .rodape{margin-top:auto; font-size:12px; color:var(--muted); padding:0 8px}
.top .rodape a{color:var(--accent)}

/* ---------- barra de local ---------- */
.where{background:var(--surface); border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:10px;
  display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field label{font-size:12.5px; font-weight:600; color:var(--muted)}
.field select,.field input{height:42px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 12px; min-width:0}
#uf{width:96px}
.field.grow{flex:0 1 360px; position:relative}
#cidade{width:100%}
.sugbox{position:absolute; top:100%; left:0; right:0; z-index:1500; margin-top:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:4px; list-style:none; max-height:320px; overflow:auto}
.sugbox li{padding:9px 12px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; gap:8px}
.sugbox li small{color:var(--muted)}
.sugbox li[aria-selected="true"],.sugbox li:hover{background:var(--sel)}
.sugbox .vazio{color:var(--muted); cursor:default}
.btn{height:42px; border-radius:10px; border:1px solid var(--line); background:var(--surface); padding:0 14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none; color:inherit}
.btn svg{width:18px; height:18px; flex:none}
.btn.peq{height:36px; padding:0 12px; font-size:14px}
.note{font-size:13px; color:var(--muted); flex-basis:100%; margin:0}
.note:empty{display:none}
.note.warn{color:var(--bad)}

/* ---------- área principal ---------- */
.main{min-height:0; position:relative}
.view{height:100%; overflow:auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 48px}
.inner{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.vtit{display:flex; align-items:center; gap:16px; min-width:0}
.ptile{width:56px; height:56px; border-radius:14px; flex:none; display:grid; place-items:center; background:linear-gradient(145deg, var(--tile1), var(--tile2)); box-shadow:0 6px 14px rgb(35 51 140 / .25); --c1:#fff; --c2:rgb(255 255 255 / .5)}
.ptile .dico{width:32px; height:32px}
.vhead h2{margin:0; font-family:var(--f-display); font-weight:800; font-size:clamp(23px, 3.2vw, 32px); letter-spacing:-.02em; line-height:1.1}
.vhead p{margin:4px 0 0; color:var(--muted)}
.acoes{display:flex; gap:8px; flex-wrap:wrap}
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-width:0}
.kpi .k{font-size:13px; font-weight:600; color:var(--muted)}
.kpi .v{font-family:var(--f-display); font-weight:800; font-size:32px; line-height:1.1; margin-top:6px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.kpi .s{font-size:13px; color:var(--muted); margin-top:2px}
.kpi.alerta .v{color:var(--bad)} .kpi.atencao .v{color:var(--warn)}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0}
.box h3{margin:0 0 12px; font-size:16px; font-family:var(--f-display); font-weight:600}
.box h3 small{font-family:var(--f-body); font-weight:400; color:var(--muted); font-size:13px}
.src{font-size:12.5px; color:var(--muted); margin:0}
.src a{color:var(--accent)}
.aviso{display:flex; gap:12px; align-items:flex-start; background:var(--lapis-soft); border:1px solid color-mix(in srgb, var(--lapis) 45%, transparent); border-radius:var(--r); padding:12px 14px; font-size:14px}
.aviso svg{width:22px; height:22px; color:var(--lapis-ink); flex:none; margin-top:1px}

/* redes */
.r1{--c:var(--r-fed)} .r2{--c:var(--r-est)} .r3{--c:var(--r-mun)} .r4{--c:var(--r-pri)}
.stack{display:flex; height:24px; border-radius:7px; overflow:hidden; background:var(--sunk)}
.stack div{height:100%; background:var(--c)}
.leg{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:13px; color:var(--muted)}
.leg span{display:inline-flex; align-items:center; gap:6px}
.leg i{width:10px; height:10px; border-radius:2px; background:var(--c)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:12px; letter-spacing:.04em; color:var(--muted); font-weight:600; background:var(--surface)}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td .dot{display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--c); margin-right:8px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sel)}
tr.tot td{font-weight:700; border-bottom:0}

/* comparação município × estado */
.cmp{display:grid; gap:10px}
.cmp-item{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:baseline}
.cmp-item .nome{font-size:14px; min-width:0}
.cmp-item .pct{font-family:var(--f-display); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; text-align:right}
.cmp-item .trk{grid-column:1 / -1; position:relative; height:10px; background:var(--sunk); border-radius:5px}
.cmp-item .trk i{position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent)}
.cmp-item .trk b{position:absolute; top:-3px; bottom:-3px; width:3px; border-radius:2px; background:var(--lapis-ink)}
.cmp-item .sub{grid-column:1 / -1; font-size:12.5px; color:var(--muted)}
.cmp-item.ruim .pct{color:var(--bad)} .cmp-item.ruim .trk i{background:var(--bad)}
.cmp-leg{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:0 0 12px}
.cmp-leg i{display:inline-block; width:14px; height:8px; border-radius:3px; background:var(--accent); margin-right:5px; vertical-align:0}
.cmp-leg i.ref{width:3px; height:14px; background:var(--lapis-ink); vertical-align:-3px}

/* lista de escolas */
.filtros{display:flex; flex-direction:column; gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chips .rot{font-size:12.5px; font-weight:600; color:var(--muted); margin-right:4px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px 5px 9px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px}
.chip i{width:10px; height:10px; border-radius:50%; background:var(--c, var(--accent)); flex:none}
.chip[aria-pressed="false"]{color:var(--muted); background:transparent}
.chip[aria-pressed="false"] i{background:transparent; box-shadow:inset 0 0 0 2px var(--c, var(--accent))}
.linha-busca{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.busca{height:42px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 12px; flex:1 1 240px; min-width:0}
.busca.cod{flex:0 1 170px; font-variant-numeric:tabular-nums; letter-spacing:.04em}
.linha-busca select{height:42px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 10px}
.tog{display:inline-flex; align-items:center; gap:7px; font-size:14px; cursor:pointer}
.tog input{width:18px; height:18px; accent-color:var(--accent)}
.resumo-lista{font-size:13.5px; color:var(--muted)}
.resumo-lista b{color:var(--ink)}
.lista{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap:10px; align-items:start}
.esc{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px 12px 12px; display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:0 12px; cursor:pointer; text-align:left; width:100%}
.esc:hover{border-color:var(--accent)}
.esc .stripe{grid-row:1 / span 3; border-radius:4px; background:var(--c)}
.esc h4{margin:0; font-size:15px; line-height:1.25; font-weight:700; overflow-wrap:anywhere}
.esc .mat{font-family:var(--f-display); font-weight:800; font-size:18px; text-align:right; line-height:1.1; font-variant-numeric:tabular-nums}
.esc .mat small{display:block; font-family:var(--f-body); font-weight:500; font-size:11.5px; color:var(--muted)}
.esc .meta{grid-column:2 / span 2; display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.esc .etapas{grid-column:2 / span 2; font-size:13px; color:var(--muted); margin-top:6px}
.esc .falta{grid-column:2 / span 2; font-size:13px; color:var(--bad); margin-top:6px; font-weight:600}
.pill{font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 8px; background:var(--sunk); color:var(--muted); white-space:nowrap}
.pill.rede{color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent)}
.pill.paral{background:var(--bad-soft); color:var(--bad)}
.pill.copiar{border:0; cursor:pointer; background:var(--accent-soft); color:var(--accent); font-family:var(--f-body)}
.pill.dif{background:var(--lapis-soft); color:var(--lapis-ink)}
.mais{justify-self:center}
.vazio-lista{padding:28px 16px; text-align:center; color:var(--muted); grid-column:1 / -1}
.vazio-lista b{display:block; color:var(--ink); font-family:var(--f-display); font-size:18px; margin-bottom:4px}

/* ficha da escola (janela no computador, folha de baixo no celular) */
.ficha-fundo{position:fixed; inset:0; z-index:2500; background:rgb(10 14 30 / .45); display:grid; place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.ficha{background:var(--bg); width:min(760px, 100%); max-height:100%; overflow:auto; border-radius:18px; box-shadow:var(--shadow); display:flex; flex-direction:column}
.ficha-cab{position:sticky; top:0; z-index:2; background:var(--surface); border-bottom:1px solid var(--line); padding:16px 18px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px}
.ficha-cab h3{margin:0; font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.15; letter-spacing:-.01em; overflow-wrap:anywhere}
.ficha-cab .meta{grid-column:1; display:flex; flex-wrap:wrap; gap:5px}
.fechar{grid-row:1 / span 2; grid-column:2; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--bg); display:grid; place-items:center}
.fechar svg{width:20px; height:20px}
.ficha-corpo{padding:16px 18px 22px; display:flex; flex-direction:column; gap:14px}
.nums{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.num{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.num b{display:block; font-family:var(--f-display); font-weight:800; font-size:24px; line-height:1.1; font-variant-numeric:tabular-nums}
.num span{font-size:12.5px; color:var(--muted)}
.dl{display:grid; grid-template-columns:minmax(0,1fr) auto; font-size:14px}
.dl > span{padding:6px 0; border-bottom:1px solid var(--line)}
.dl > span:nth-child(even){text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.infra{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px 16px; font-size:14px}
.infra span{display:flex; gap:8px; align-items:flex-start; padding:4px 0}
.infra svg{width:18px; height:18px; flex:none; margin-top:1px}
.infra .sim{color:var(--ok)} .infra .nao{color:var(--none)} .infra .ruim{color:var(--bad); font-weight:600}
.infra .nao + em{color:var(--muted)}
.infra em{font-style:normal}

/* ---------- painel ---------- */
.rs-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:12px}
.rs-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; cursor:pointer; transition:border-color .15s, box-shadow .15s; text-align:left; font:inherit; color:inherit}
.rs-card:hover{border-color:var(--accent); box-shadow:var(--shadow)}
.rs-card.rs-alerta{border:2px solid var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 14%, transparent)}
.rs-card.rs-atencao{border:2px solid var(--warn)}
.rs-card header{display:flex; align-items:center; gap:10px}
.rs-card h3{margin:0; font-size:15px; font-weight:700}
.rs-ic{width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); flex:none}
.rs-ic .dico{width:24px; height:24px}
.rs-big{font-family:var(--f-display); font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1.05; font-variant-numeric:tabular-nums}
.rs-big small{display:block; font-family:var(--f-body); font-size:13.5px; font-weight:500; color:var(--muted); letter-spacing:0; margin-top:3px}
.rs-lista{margin:0; padding:0; list-style:none; display:grid; gap:5px; font-size:14px}
.rs-lista b{font-variant-numeric:tabular-nums}
.rs-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:1px 8px; font-weight:700; font-size:12.5px; white-space:nowrap; margin-right:4px}
.rs-pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.rs-pill.ok{background:var(--ok-soft); color:var(--ok)} .rs-pill.warn{background:var(--warn-soft); color:var(--warn)} .rs-pill.bad{background:var(--bad-soft); color:var(--bad)}
.rs-link{display:inline-flex; align-items:center; gap:4px; font-weight:700; color:var(--accent); font-size:14px; margin-top:auto}

.tip{cursor:help; text-decoration:underline dotted color-mix(in srgb, currentColor 55%, transparent); text-underline-offset:3px}

/* ---------- celular ---------- */

  .app{grid-template-rows:auto auto minmax(0,1fr) auto}

  .kpis{grid-template-columns:repeat(2, minmax(0,1fr))}

  .tabbar{display:grid; grid-template-columns:repeat(var(--n, 2), minmax(0,1fr)); background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0; background:transparent; padding:8px 0 10px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; font-weight:700; color:var(--muted)}
  .tabbar button .dico{width:24px; height:24px; --c1:var(--muted); --c2:color-mix(in srgb, var(--muted) 30%, var(--surface))}
  .tabbar button[aria-pressed="true"]{color:var(--ink)}
  .tabbar button[aria-pressed="true"] .dico{--c1:var(--accent); --c2:color-mix(in srgb, var(--lapis) 70%, var(--surface))}
}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAcento = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmt = n => n == null ? "–" : Number(n).toLocaleString("pt-BR");
const pct = (a, b) => b ? Math.round(a * 100 / b) : null;
const dataBR = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR"); };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("educaja:" + k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem("educaja:" + k, JSON.stringify(v)); } catch {} },
};
const PADRAO = {uf: 51, mun: 5106752};   // Mato Grosso, Pontes e Lacerda
const REDE = {1: "Federal", 2: "Estadual", 3: "Municipal", 4: "Privada"};
const ORDEM_REDE = [3, 2, 1, 4];
const ICO = {
  sim: '<svg class="sim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  nao: '<svg class="nao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 12h12"/></svg>',
  ruim: '<svg class="ruim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  csv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>',
  fechar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.5a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM10.5 11h3v7h-3z"/></svg>',
};

/* Infraestrutura: índice do bit (mesma ordem do coletar_escolas.py). "ruim" = ter o item é um problema. */
const IB = {agua:0, semAgua:1, semEnergia:2, semEsgoto:3, esgotoRede:4, banheiro:5, banheiroPNE:6, biblioteca:7, labCiencias:8, labInfo:9,
  quadra:10, quadraCoberta:11, refeitorio:12, cozinha:13, parque:14, internet:15, internetAlunos:16, bandaLarga:17, semAcess:18, aee:19,
  alimentacao:20, areaVerde:21, patioCoberto:22, salaProf:23, lixo:24, predio:25, indigena:26};
const tem = (r, b) => ((r[C.infra] || 0) >> b) & 1;
/* Indicadores mostrados na comparação município × estado (escolas públicas em atividade). */
const INDIC = [
  ["Água potável", r => tem(r, IB.agua)],
  ["Energia elétrica", r => !tem(r, IB.semEnergia)],
  ["Esgoto (rede ou fossa)", r => !tem(r, IB.semEsgoto)],
  ["Banheiro", r => tem(r, IB.banheiro)],
  ["Banheiro acessível", r => tem(r, IB.banheiroPNE)],
  ["Algum recurso de acessibilidade", r => !tem(r, IB.semAcess)],
  ["Internet para os alunos", r => tem(r, IB.internetAlunos)],
  ["Biblioteca ou sala de leitura", r => tem(r, IB.biblioteca)],
  ["Quadra de esportes", r => tem(r, IB.quadra)],
  ["Laboratório de ciências", r => tem(r, IB.labCiencias)],
  ["Sala de atendimento especializado (AEE)", r => tem(r, IB.aee)],
];
/* O básico: falta de qualquer um vira alerta no Painel. */
const BASICO = [["sem água potável", r => !tem(r, IB.agua)], ["sem energia elétrica", r => tem(r, IB.semEnergia)], ["sem banheiro", r => !tem(r, IB.banheiro)]];

let C = {};                 // índice de cada campo das escolas (vem do meta.json)
let META = null, MUN = [], MUN_POR_ID = new Map(), UFS = {};
const CACHE = new Map();    // escolas por UF
const S = {uf: null, mun: null, view: "painel", rows: [],
  f: {redes: new Set([1, 2, 3, 4]), locs: new Set([1, 2]), q: "", cod: "", paral: false, ord: "nome", lim: 60}};

/* ===================== utilidades ===================== */
async function getJSON(url){
  const r = await fetch(url, {cache: "no-cache"});
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}
function toast(t){
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t; el.setAttribute("role", "status");
  document.body.append(el); setTimeout(() => el.remove(), 2600);
}
function nota(t, aviso){ const n = $("#note"); n.textContent = t || ""; n.classList.toggle("warn", !!aviso); }
const nomeMun = id => MUN_POR_ID.get(id)?.[1] || "";
const siglaUF = uf => UFS[uf]?.[0] || "";
const nomeUF = uf => UFS[uf]?.[1] || "";
const lugar = () => S.mun ? nomeMun(S.mun) : nomeUF(S.uf);
const etapas = r => [[C.mat_creche, "Creche"], [C.mat_pre, "Pré-escola"], [C.mat_fund_ai, "Fund. anos iniciais"], [C.mat_fund_af, "Fund. anos finais"],
  [C.mat_medio, "Ensino médio"], [C.mat_profissional, "Ed. profissional"], [C.mat_eja, "EJA"]].filter(([i]) => r[i] > 0).map(([, n]) => n);
const ativa = r => r[C.situacao] === 1;
const publica = r => r[C.rede] !== 4;
function tituloEscola(n){
  // o INEP grava em maiúsculas: deixa legível sem mexer em siglas curtas
  const minus = new Set(["de", "da", "do", "das", "dos", "e", "em"]);
  return String(n || "").toLowerCase().split(" ").map((p, i) =>
    (i > 0 && minus.has(p)) ? p : /^(ee|em|emei|emef|cei|cmei|eeb|ete|ifmt|if|ceja|apae|cefapro|eepg|epp|me|ltda|ii|iii|iv|vi|vii|viii|ix|x)$/i.test(p) ? p.toUpperCase() : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
}

async function salvar(nome, data){
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl){
    try { await dl.save({filename: nome, data}); toast("Arquivo pronto"); }
    catch (e){ if (e?.code !== "declined") toast("Não foi possível baixar aqui. Tente no site publicado."); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  if (window.EducaJaAndroid?.salvar){   // dentro do app Android: o app grava em Downloads
    const b64 = await new Promise((ok, erro) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1] || ""); fr.onerror = erro; fr.readAsDataURL(blob); });
    window.EducaJaAndroid.salvar(nome, b64, blob.type || "text/csv");
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Download iniciado");
}

/* ===================== dados ===================== */
async function carregarUF(uf){
  if (!CACHE.has(uf)) CACHE.set(uf, getJSON(`data/escolas/${uf}.json`).then(j => j.e).catch(e => { CACHE.delete(uf); throw e; }));
  return CACHE.get(uf);
}

/* ===================== local (estado e município) ===================== */
function preencherUFs(){
  const disp = new Set(META.ufs);
  $("#uf").innerHTML = Object.entries(UFS).sort((a, b) => a[1][0].localeCompare(b[1][0]))
    .map(([cod, [sg, nome]]) => `<option value="${cod}" ${disp.has(+cod) ? "" : "disabled"}>${sg}</option>`).join("");
}
async function trocarUF(uf, mun){
  S.uf = uf; S.mun = mun ?? null; $("#uf").value = uf;
  $("#cidade").value = S.mun ? nomeMun(S.mun) : "";
  const box = document.createElement("div"); box.className = "loading"; box.textContent = "Carregando escolas de " + nomeUF(uf) + "…";
  $(".main").append(box);
  try { S.rows = await carregarUF(uf); nota(""); }
  catch { S.rows = []; nota("Não foi possível carregar os dados deste estado. Verifique a conexão e tente de novo.", true); }
  finally { box.remove(); }
  S.f.lim = 60;
  salvarLocal(); renderTudo();
}
function escolherMun(id){
  const m = MUN_POR_ID.get(id);
  if (!m) return;
  fecharSug();
  if (+m[3] !== S.uf){ trocarUF(m[3], id); return; }
  S.mun = id; $("#cidade").value = m[1]; S.f.lim = 60; nota("");
  salvarLocal(); renderTudo();
}
function salvarLocal(){ store.set("local", {uf: S.uf, mun: S.mun}); $("#todo-estado").hidden = !S.mun; }

/* sugestões próprias (a lista nativa do navegador fica ruim no app Android) */
let sugIdx = -1, sugItens = [];
function abrirSug(){
  const q = semAcento($("#cidade").value.trim());
  const daUF = MUN.filter(m => m[3] === S.uf);
  let itens;
  if (!q) itens = [];
  else {
    const comeca = daUF.filter(m => m[4].startsWith(q)), meio = daUF.filter(m => !m[4].startsWith(q) && m[4].includes(q));
    itens = [...comeca, ...meio];
    if (itens.length < 3){ const fora = MUN.filter(m => m[3] !== S.uf && m[4].startsWith(q)); itens = [...itens, ...fora]; }
    itens = itens.slice(0, 8);
  }
  sugItens = itens; sugIdx = itens.length ? 0 : -1;
  const ul = $("#sug");
  if (!q){ ul.hidden = true; $("#cidade").setAttribute("aria-expanded", "false"); return; }
  ul.innerHTML = itens.length ? itens.map((m, i) => `<li role="option" id="sug-${i}" data-id="${m[0]}" aria-selected="${i === sugIdx}">${esc(m[1])}<small>${esc(siglaUF(m[3]))}</small></li>`).join("")
    : `<li class="vazio" role="option" aria-disabled="true">Nenhum município com esse nome</li>`;
  ul.hidden = false; $("#cidade").setAttribute("aria-expanded", "true");
}
function fecharSug(){ $("#sug").hidden = true; $("#cidade").setAttribute("aria-expanded", "false"); }
function marcarSug(i){
  sugIdx = i;
  document.querySelectorAll("#sug li[data-id]").forEach((li, k) => li.setAttribute("aria-selected", k === i));
  $("#cidade").setAttribute("aria-activedescendant", i >= 0 ? "sug-" + i : "");
}

/* ===================== navegação ===================== */
function setView(v, {semHash} = {}){
  const m = /^escola-(\d{8})$/.exec(v || "");
  if (m){ buscarCodigo(+m[1], {doLink: true}); return; }
  if (!["painel", "escolas"].includes(v)) v = "painel";
  S.view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  $("#v-painel").hidden = v !== "painel"; $("#v-escolas").hidden = v !== "escolas";
  if (!semHash && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  $("#v-" + v).scrollTop = 0;
}
function renderTudo(){ renderPainel(); renderEscolas(); }

/* ===================== cálculos ===================== */
function resumo(rows){
  const at = rows.filter(ativa);
  const porRede = {};
  for (const r of at){ const k = r[C.rede]; (porRede[k] ||= {esc: 0, mat: 0, rural: 0}); porRede[k].esc++; porRede[k].mat += r[C.mat_total] || 0; porRede[k].rural += r[C.localizacao] === 2; }
  const pub = at.filter(publica);
  return {at, pub, porRede, mat: at.reduce((s, r) => s + (r[C.mat_total] || 0), 0), paral: rows.length - at.length,

/* ===================== busca pelo código INEP ===================== */
/* Os 2 primeiros dígitos do código INEP são o código do estado (51 = MT). */
async function buscarCodigo(cod, {doLink} = {}){
  const uf = Math.floor(cod / 1e6);
  if (!META || !META.ufs.includes(uf)){ nota(`O código ${cod} não corresponde a nenhum estado. Confira os 8 dígitos.`, true); if (doLink) setView("escolas"); return; }
  let rows;
  try { rows = uf === S.uf ? S.rows : await carregarUF(uf); }
  catch { nota("Não foi possível carregar os dados desse estado agora. Tente de novo.", true); return; }
  const r = rows.find(x => x[C.codigo] === cod);
  if (!r){ nota(`Nenhuma escola em atividade ou paralisada com o código ${cod} no Censo Escolar ${META.ano}.`, true); if (doLink) setView("escolas"); return; }
  nota("");
  S.f.cod = ""; S.f.q = "";
  if (uf !== S.uf) await trocarUF(uf, r[C.municipio]);
  else if (S.mun !== r[C.municipio]) escolherMun(r[C.municipio]);
  else renderTudo();
  setView("escolas", {semHash: true});
  history.replaceState(null, "", "#escolas");
  abrirFicha(cod);
}

function copiarLink(cod){
  const url = location.href.split("#")[0] + "#escola-" + cod;
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => toast("Link da escola copiado"), () => mostrarLink(url));
  else mostrarLink(url);
}

        <div class="num"><b>${fmt(r[C.turmas] || 0)}</b><span>turmas</span></div>
        <div class="num"><b>${fmt(r[C.docentes] || 0)}</b><span>professores</span></div>
        <div class="num"><b>${fmt(r[C.salas] || 0)}</b><span>salas em uso</span></div>
      </div>
      <div class="box"><h3>Alunos por etapa</h3>${r[C.mat_total] ? `<div class="dl">
        ${nz(C.mat_creche, "Creche")}${nz(C.mat_pre, "Pré-escola")}${nz(C.mat_fund_ai, "Fundamental, anos iniciais (1º ao 5º)")}${nz(C.mat_fund_af, "Fundamental, anos finais (6º ao 9º)")}
        ${nz(C.mat_medio, "Ensino médio")}${nz(C.mat_profissional, "Educação profissional")}${nz(C.mat_eja, "EJA (jovens e adultos)")}
        ${nz(C.mat_especial, "Educação especial (deficiência, autismo, altas habilidades)")}${nz(C.mat_integral, "Em tempo integral")}
        ${nz(C.mat_moram_zona_rural, "Moram na zona rural")}${nz(C.mat_transporte_publico, "Usam transporte escolar público")}</div>` : `<p class="src">Sem alunos matriculados ${ativa(r) ? "na data do Censo" : "(escola paralisada)"}.</p>`}</div>
      <div class="box"><h3>Professores <small>(na data do Censo)</small></h3><div class="dl">
        ${n(C.docentes, "Professores")}${n(C.docentes_superior, "Com curso superior")}${n(C.docentes_licenciatura, "Com licenciatura")}
        ${n(C.docentes_concursados, "Concursados")}${n(C.docentes_contratados, "Contratados temporários")}</div></div>
      <div class="box"><h3>Estrutura</h3><div class="infra">${infraLinhas}</div>
        <div class="dl" style="margin-top:10px">${n(C.salas_climatizadas, "Salas climatizadas")}${n(C.salas_acessiveis, "Salas acessíveis")}${n(C.computadores_alunos, "Computadores e tablets para alunos")}
        ${n(C.prof_bibliotecario, "Bibliotecários")}${n(C.prof_psicologo, "Psicólogos")}${n(C.prof_assist_social, "Assistentes sociais")}${n(C.prof_nutricionista, "Nutricionistas")}</div></div>
      <p class="src">Fonte: ${esc(META.fonte)}, informado pela própria escola. Data de referência: ${esc(META.data_referencia)}.</p>
    </div></div>`;
  document.body.append(fundo);
  fichaAberta = cod;
  if (!semHistorico) history.pushState({ficha: cod}, "", "#escola-" + cod);
  fundo.querySelector(".fechar").focus();
}
function fecharFicha(semVoltar){
  const f = $("#ficha"); if (!f) return;
  f.remove(); const cod = fichaAberta; fichaAberta = null;
  if (!semVoltar && history.state?.ficha) history.back();
  if (/^#escola-/.test(location.hash)) history.replaceState(history.state, "", "#escolas");
  const card = document.querySelector(`[data-esc="${cod}"]`); if (card && !semVoltar) card.focus();
}

/* ===================== eventos ===================== */
function ligar(){
  document.querySelectorAll(".views [data-view], .tabbar [data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (/^escola-/.test(h) && fichaAberta) return; setView(h, {semHash: true}); });
  addEventListener("popstate", () => { if (fichaAberta && !history.state?.ficha) fecharFicha(true); });
  $("#uf").addEventListener("change", e => trocarUF(+e.target.value, null));
  $("#todo-estado").addEventListener("click", () => { S.mun = null; $("#cidade").value = ""; S.f.lim = 60; salvarLocal(); renderTudo(); });
  const cid = $("#cidade");
  cid.addEventListener("focus", () => { cid.dataset.antes = cid.value; cid.placeholder = cid.value || "Digite o nome da cidade"; cid.value = ""; abrirSug(); });
  cid.addEventListener("input", abrirSug);
  cid.addEventListener("blur", () => setTimeout(() => { if (!cid.value.trim()) cid.value = S.mun ? nomeMun(S.mun) : ""; cid.placeholder = "Digite o nome da cidade"; fecharSug(); }, 180));
  cid.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && sugItens.length){ e.preventDefault(); marcarSug(Math.min(sugIdx + 1, sugItens.length - 1)); }
    else if (e.key === "ArrowUp" && sugItens.length){ e.preventDefault(); marcarSug(Math.max(sugIdx - 1, 0)); }
    else if (e.key === "Enter"){ e.preventDefault(); if (sugItens[sugIdx]){ escolherMun(sugItens[sugIdx][0]); cid.blur(); } }
    else if (e.key === "Escape"){ cid.value = ""; cid.blur(); }
  });
  $("#sug").addEventListener("mousedown", e => { const li = e.target.closest("li[data-id]"); if (li){ e.preventDefault(); escolherMun(+li.dataset.id); cid.blur(); } });

  document.addEventListener("click", e => {
    const t = e.target;
    const ir = t.closest("[data-ir]"); if (ir){ setView(ir.dataset.ir); return; }
    const ch = t.closest("[data-rede]"); if (ch){ const k = +ch.dataset.rede; S.f.redes.has(k) ? S.f.redes.delete(k) : S.f.redes.add(k); ch.setAttribute("aria-pressed", S.f.redes.has(k)); S.f.lim = 60; renderLista(); return; }
    const lc = t.closest("[data-loc]"); if (lc){ const k = +lc.dataset.loc; S.f.locs.has(k) ? S.f.locs.delete(k) : S.f.locs.add(k); lc.setAttribute("aria-pressed", S.f.locs.has(k)); S.f.lim = 60; renderLista(); return; }
    const es = t.closest("[data-esc]"); if (es){ abrirFicha(+es.dataset.esc); return; }
    if (t.closest("#e-mais")){ S.f.lim += 60; renderLista(); return; }
    if (t.closest("#e-csv")){ exportarCSV(); return; }
    const tm = t.closest("tr[data-mun]"); if (tm){ escolherMun(+tm.dataset.mun); $("#v-escolas").scrollTop = 0; return; }
    if (t.closest("[data-fechar]") || t.classList.contains("ficha-fundo")){ fecharFicha(); return; }
    const cp = t.closest("[data-copiar]"); if (cp){ copiarLink(cp.dataset.copiar); return; }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "e-q"){ S.f.q = e.target.value; S.f.lim = 60; renderLista(); }
    if (e.target.id === "e-cod"){
      const v = e.target.value.replace(/\D/g, "").slice(0, 8);
      if (v !== e.target.value) e.target.value = v;
      S.f.cod = v; S.f.lim = 60; renderLista();
      if (v.length === 8) buscarCodigo(+v);
    }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "e-paral"){ S.f.paral = e.target.checked; S.f.lim = 60; renderLista(); }
    if (e.target.id === "e-ord"){ S.f.ord = e.target.value; renderLista(); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && fichaAberta) fecharFicha(); });
}

/* ===================== início ===================== */
async function iniciar(){
  ligar();
  try {
    const [mj, meta] = await Promise.all([getJSON("data/municipios.json"), getJSON("data/escolas/meta.json")]);
    META = meta; UFS = mj.ufs;
    C = Object.fromEntries(meta.campos.map((k, i) => [k, i]));
    MUN = mj.m.map(m => [m[0], m[1], m[2], Math.floor(m[0] / 100000), semAcento(m[1])]);
    MUN_POR_ID = new Map(MUN.map(m => [m[0], m]));
  } catch {
    nota("Não foi possível carregar os dados. Verifique a conexão e recarregue a página.", true); return;
  }
  preencherUFs();
  const salvo = store.get("local");
  const ini = salvo && UFS[salvo.uf] && META.ufs.includes(salvo.uf) ? salvo : PADRAO;
  const h = location.hash.slice(1);
  const link = /^escola-\d{8}$/.test(h);
  if (!link) setView(h || "painel", {semHash: !location.hash});
  await trocarUF(ini.uf, ini.mun && MUN_POR_ID.has(ini.mun) ? ini.mun : null);
  if (link) setView(h);
}
iniciar();

if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude)
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
})();
</script>
